name: Build Windows binary (manual)

on:
  workflow_dispatch: # only runs when you click "Run workflow" in the Actions tab

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
          dune-cache: true

      - name: Install dependencies
        run: opam install . --deps-only

      - name: Build
        run: opam exec -- dune build --profile release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item _build/default/src/main.exe dist/graphic-calc.exe
          Copy-Item assets/Roboto-Regular.ttf dist/
          Compress-Archive -Path dist/* -DestinationPath graphic-calc-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: graphic-calc-windows-x86_64
          path: graphic-calc-windows-x86_64.zip
